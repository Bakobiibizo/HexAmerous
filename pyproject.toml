[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hexamerous"
version = "1.0.0"
description = "A local-first desktop coding agent with persistent project context"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Richard Porteous" }]
dependencies = [
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
openai = ["openai>=1.68,<2"]
anthropic = ["anthropic>=0.49,<1"]
desktop = ["PySide6>=6.8,<7"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
hexamerous = "hexamerous.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hexamerous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires an external service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
